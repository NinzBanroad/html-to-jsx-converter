<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Page</title>
</head>
<body>
  <!-- A simple card component -->
  <div class="card" style="padding: 16px; background-color: #fff; border-radius: 8px;">
    <img src="logo.png" alt="Logo" class="logo">
    <h2 class="title">Welcome</h2>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" required>
    <button onclick="submit()" tabindex="0" disabled>Sign up</button>
    <br>
    <p>Read our <a href="/terms" target="_blank">terms &amp; conditions</a>.</p>
  </div>
</body>
</html>
